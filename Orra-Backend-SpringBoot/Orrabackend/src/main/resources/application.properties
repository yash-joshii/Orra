spring.datasource.driver-class-name=org.postgresql.Driver

# ── SSL Fix ──────────────────────────────────────────────────
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

# ── JPA ──────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ── RabbitMQ ─────────────────────────────────────────────────
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

app.rabbitmq.exchange=payment.exchange
app.rabbitmq.payment-success-queue=payment.success.queue
app.rabbitmq.booking-confirmed-queue=booking.confirmed.queue
app.rabbitmq.payment-success-routing-key=payment.success
app.rabbitmq.booking-confirmed-routing-key=booking.confirmed

